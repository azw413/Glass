[package]
name = "glass-arch-arm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
armv8-encode.workspace = true
# x86 operand/branch-target introspection over the `iced_x86::Instruction`
# that armv8-encode's `X86DecodedInstruction` carries (it doesn't re-export
# iced). Feature set kept in lockstep with the workspace pin.
iced-x86.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
bitflags = "2"
# Demangle C++ (Itanium), Rust, Swift and ObjC symbols.
symbolic-demangle = { version = "12", default-features = false, features = ["cpp", "rust", "swift"] }
symbolic-common = "12"

[lints]
workspace = true
